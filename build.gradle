plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // The patched pure-Java Ogg Vorbis ENCODER (jVorbisEnc with a data fix, see
    // repo/dev/custommusic/jvorbisenc-patched/) lives in this project-local repo.
    maven { name = 'ProjectLocal'; url = uri('repo') }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Audio codecs — see repo/dev/custommusic/ for the patched/merged artifacts:
    //  - audio-codecs: merged JavaSound SPI bundle (mp3spi/vorbisspi/jlayer/jorbis/
    //    tritonus-share LGPL + JAAD public domain, decodes .ogg/.mp3/.m4a/.aac/.mp4).
    //    Merged into ONE jar because vorbisspi and mp3spi both ship the javazoom.spi
    //    package, which the module system rejects as a split package.
    //  - jvorbisenc-patched: pure-Java Ogg Vorbis ENCODER (port of libvorbis) with a
    //    data fix — nothing else encodes .ogg in pure Java.
    [
        'dev.custommusic:audio-codecs:1.0',
        'dev.custommusic:jvorbisenc-patched:0.0.3',
    ].each { coord ->
        def (group, name, ver) = coord.split(':').toList()
        jarJar(group: group, name: name, version: "[${ver},)") {
            jarJar.pin(it, ver)
        }
        implementation "$group:$name:$ver"
    }
}

// Make `./gradlew build` also produce the jar-in-jar artifact.
tasks.named('build') {
    dependsOn 'jarJar'
}

// Low-memory builds (opt-in via CM_LOWMEM=1): NeoForm's decompile step forks
// Vineflower with -Xmx4g by default, which the OOM-killer slays on a 4 GiB
// machine (the fork dies with SIGKILL / exit 137). The official way to right-
// size it is the `subsystems` DSL — jvmArguments on the task cannot override
// it (NeoFormRuntimeExtension strips -Xmx from the step's jvm args and re-adds
// its own from these settings). CI runners and normal dev machines do NOT set
// CM_LOWMEM and keep the stock 4g defaults.
if (System.getenv('CM_LOWMEM') == '1') {
    subsystems {
        decompiler {
            maxMemory = '1800m'
        }
        recompiler {
            maxMemory = '1800m'
        }
    }
    // Non-(-Xmx) JVM flags DO pass through (only -Xmx* is stripped and
    // re-added from the subsystems settings). ParallelGC is the fastest
    // collector for a batch decompile/recompile job.
    tasks.withType(net.neoforged.gradle.dsl.common.tasks.Execute).configureEach {
        jvmArguments.add('-XX:+UseParallelGC')
    }
}

processResources {
    def replaceProperties = [
        minecraft_version   : minecraft_version,
        neo_version         : neo_version,
        mod_id              : mod_id,
        mod_version         : mod_version,
        mod_license         : mod_license,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }

    client {
        client()
    }

    server {
        server()
        programArgument '--nogui'
    }
}
