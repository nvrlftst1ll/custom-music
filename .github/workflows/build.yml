name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a 2024-era JDK: the NeoForm decompile step output is
      # JDK-patch-version sensitive, and NeoForge's patches were generated
      # against a 21.0.3/21.0.4-era canonical decompile. A newer 21.0.x may
      # still work (the patcher tolerates small differences), but this pin
      # keeps CI byte-reproducible. See DEVNOTES.md.
      - name: Set up JDK 21.0.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.4"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: custommusic-mod
          path: build/libs/custommusic-1.0.0-all.jar
          if-no-files-found: error
