name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a 2024-era JDK: the NeoForm decompile step output is
      # JDK-patch-version sensitive, and NeoForge's patches were generated
      # against a 21.0.3/21.0.4-era canonical decompile. A newer 21.0.x may
      # still work (the patcher tolerates small differences), but this pin
      # keeps CI byte-reproducible. See DEVNOTES.md.
      - name: Set up JDK 21.0.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.4"

      # THE FIX: NeoGradle 7.0.x (the build plugin of this project) is NOT
      # compatible with Gradle 9+ — Gradle 9 removed the internal method
      # org.gradle.util.internal.GUtil#toCamelCase, which NeoGradle calls at
      # configuration time, so any step using bare `gradle` dies with:
      #   'java.lang.String org.gradle.util.internal.GUtil.toCamelCase(...)'
      # Without this input the action installs the LATEST Gradle (9.x now),
      # which is exactly what broke the build. Stay on the 8.x line; 8.10 is
      # the version pinned in gradle/wrapper/gradle-wrapper.properties.
      # NB: quotes are mandatory — an unquoted 8.10 is parsed by YAML as 8.1!
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # Safety net: (re)generate the wrapper ONLY if it is not committed
      # (e.g. lost when uploading to GitHub via the web UI). When gradlew
      # IS committed — as in this repo — this step is skipped entirely,
      # because even under the pinned 8.10 it needlessly re-evaluates the
      # whole build (~40 s) on every run.
      - name: Ensure Gradle wrapper (skipped when committed)
        if: ${{ !hashFiles('gradlew') }}
        run: gradle wrapper --gradle-version 8.10

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The audio codecs (audio-codecs, jvorbisenc-patched) are PREBUILT jars
      # that live in the project-local maven repository repo/. build.gradle
      # resolves them by VERSION RANGE ([1.0,) / [0.0.3,)), and Gradle can NOT
      # enumerate versions of a maven repo by listing directories — it needs
      # repo/dev/custommusic/<artifact>/maven-metadata.xml. Missing repo/ files
      # or missing metadata make the build die with the cryptic:
      #   Could not find any matches for dev.custommusic:audio-codecs:[1.0,)
      # This step fails fast with an actionable message instead.
      - name: Verify bundled codec libraries (repo/)
        run: |
          set -e
          for f in \
            repo/dev/custommusic/audio-codecs/maven-metadata.xml \
            repo/dev/custommusic/audio-codecs/1.0/audio-codecs-1.0.jar \
            repo/dev/custommusic/audio-codecs/1.0/audio-codecs-1.0.pom \
            repo/dev/custommusic/jvorbisenc-patched/maven-metadata.xml \
            repo/dev/custommusic/jvorbisenc-patched/0.0.3/jvorbisenc-patched-0.0.3.jar \
            repo/dev/custommusic/jvorbisenc-patched/0.0.3/jvorbisenc-patched-0.0.3.pom
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing bundled library file: $f"
              echo "::error::The repo/ directory ships the prebuilt audio codec jars and must be committed to git (all of it: jars, poms AND maven-metadata.xml)."
              echo "::error::Fix from the project root:"
              echo "::error::  git add -A repo/ && git commit -m 'ci: add bundled codec repository' && git push"
              echo "::error::(If the jars were previously ignored: git add -f repo/)"
              exit 1
            fi
          done

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: custommusic-mod
          path: build/libs/*.jar
          if-no-files-found: error
