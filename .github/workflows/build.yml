name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a 2024-era JDK: the NeoForm decompile step output is
      # JDK-patch-version sensitive, and NeoForge's patches were generated
      # against a 21.0.3/21.0.4-era canonical decompile. A newer 21.0.x may
      # still work (the patcher tolerates small differences), but this pin
      # keeps CI byte-reproducible. See DEVNOTES.md.
      - name: Set up JDK 21.0.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.4"

      # THE FIX: NeoGradle 7.0.x (the build plugin of this project) is NOT
      # compatible with Gradle 9+ — Gradle 9 removed the internal method
      # org.gradle.util.internal.GUtil#toCamelCase, which NeoGradle calls at
      # configuration time, so any step using bare `gradle` dies with:
      #   'java.lang.String org.gradle.util.internal.GUtil.toCamelCase(...)'
      # Without this input the action installs the LATEST Gradle (9.x now),
      # which is exactly what broke the build. Stay on the 8.x line; 8.10 is
      # the version pinned in gradle/wrapper/gradle-wrapper.properties.
      # NB: quotes are mandatory — an unquoted 8.10 is parsed by YAML as 8.1!
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # Idempotent safety net: (re)generates the wrapper under 8.10 in case
      # gradlew / gradle/wrapper/* got lost during upload to GitHub.
      # A no-op if the wrapper is already committed.
      - name: Ensure Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: custommusic-mod
          path: build/libs/custommusic-1.0.0-all.jar
          if-no-files-found: error
